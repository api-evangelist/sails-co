aid: sails-co
name: Sails Co
description: >-
  Sails Co. is a full-service web, mobile, and cloud development studio (Y
  Combinator W15, Austin, Texas) founded by the creators of Sails.js. Sails.js is
  an open-source, API-driven MVC framework for Node.js — built on top of Express
  and Socket.io — for building production-ready, realtime web applications and
  data-driven REST APIs. It ships the Waterline ORM for datastore-agnostic data
  access, auto-generated "blueprint" REST APIs, first-class WebSocket support, and
  a `sails` command-line tool for scaffolding, running, and debugging apps. Sails
  is MIT-licensed and maintained by the Sails Co. team, which also offers
  professional and enterprise support for the framework.
